<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Drive Manager V1.4.2</title>
<style>
body{font-family:system-ui,"Microsoft YaHei UI";background:#f6f7f9;margin:0;color:#161616}.wrap{max-width:1080px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e1e4e8;border-radius:16px;padding:20px}.wide{grid-column:1/-1}button,.button{padding:11px 14px;border:0;border-radius:10px;background:#171717;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}.secondary{background:#eceff3;color:#222}.danger{background:#8b1e1e}.pause{background:#6c5a00}.status{color:#666;font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ok{background:#eefaf3;border:1px solid #cbeed8;padding:12px;border-radius:10px;margin-top:10px}.warn{background:#fff8e7;border:1px solid #efd48c;padding:12px;border-radius:10px;margin-top:10px}.bad{background:#fff0f0;border:1px solid #efb7b7;padding:12px;border-radius:10px;margin-top:10px}input[type=text]{width:100%;padding:12px;border:1px solid #d7dce2;border-radius:10px;font-size:16px}.transcript{white-space:pre-wrap;background:#fafbfc;border:1px solid #e4e7eb;border-radius:10px;padding:12px;margin-top:10px;max-height:260px;overflow:auto}.timerbox{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px}.result{border:1px solid #e3e7eb;border-radius:12px;padding:14px;margin-top:12px;background:#fff}.result .name{font-weight:800}.meta{font-size:13px;color:#666;margin-top:5px}.path{font-size:14px;margin-top:7px;background:#f7f8fa;padding:8px 10px;border-radius:8px;word-break:break-word}.summary{margin-top:8px;font-size:14px;line-height:1.45}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><div class="wrap"><h1>AI Drive Manager Agent</h1><p class="status">V1.4.2 · 录音 · 自动分类 · 完整路径搜索结果</p><div class="grid">
<div class="card"><h2>① Google Drive</h2><a class="button" href="/api/auth/google">连接 Google Drive</a> <button class="secondary" id="folders">建立分类文件夹</button><div id="g"></div></div>
<div class="card"><h2>② AI 状态</h2><button class="secondary" id="testai">测试 OpenAI API</button><div id="ai"></div></div>
<div class="card"><h2>③ 上传资料</h2><input id="file" type="file"><p><button id="upload">分析并归档</button></p><div id="u"></div></div>
<div class="card"><h2>④ 🎙 直接录音</h2><p class="status">开始后可暂停思考，再继续。停止确认后才转写和归档。</p><div class="row"><button id="start">🎙 开始录音</button><button id="pause" class="pause" disabled>⏸ 暂停</button><button id="resume" class="secondary" disabled>▶ 继续</button><button id="stop" class="danger" disabled>■ 停止录音</button></div><div class="timerbox"><span>总经过：<strong id="elapsed">00:00</strong></span><span>实际录音：<strong id="active">00:00</strong></span><span>状态：<strong id="state">未开始</strong></span></div><audio id="preview" controls style="display:none;width:100%;margin-top:12px"></audio><div id="r"></div></div>
<div class="card wide"><h2>⑤ 查找资料</h2><div class="row"><input id="q" type="text" placeholder="例如：Agent功能介绍 / OCBC银行资料 / 供应商报价"><button id="search">搜索</button></div><div id="s"></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function typeLabel(m){m=(m||'').toLowerCase();if(m.includes('pdf'))return 'PDF';if(m.includes('markdown'))return 'Markdown';if(m.startsWith('audio/'))return '语音';if(m.startsWith('image/'))return '图片';if(m.includes('word'))return 'Word';if(m.includes('text'))return '文本';return m||'未知'}
function fmtDate(s){if(!s)return '未知';let d=new Date(s);return isNaN(d)?s:d.toLocaleString('zh-CN',{hour12:false})}
$('testai').onclick=async()=>{let d=await(await fetch('/api/test-ai')).json();$('ai').innerHTML=d.ok?'<div class="ok">AI 调用成功</div>':'<div class="bad">'+esc(d.error)+'</div>'};
$('folders').onclick=async()=>{let d=await(await fetch('/api/setup-folders',{method:'POST'})).json();$('g').innerHTML=d.ok?'<div class="ok">分类文件夹已准备完成</div>':'<div class="bad">失败</div>'};
$('upload').onclick=async()=>{let f=$('file').files[0];if(!f)return;let fd=new FormData();fd.append('file',f);$('u').textContent='处理中…';let r=await fetch('/api/upload',{method:'POST',body:fd}),d=await r.json();$('u').innerHTML=r.ok?'<div class="ok">已归档：'+esc(d.final_name)+'<br>分类：'+esc(d.category_path)+'<br>摘要：'+esc(d.summary)+'<br><a href="'+d.web_view_link+'" target="_blank">打开文件</a></div>':'<div class="bad">'+esc(d.detail)+'</div>'};
let rec=null,chunks=[],stream=null,elapsedSec=0,activeSec=0,timerId=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')} function paint(){$('elapsed').textContent=fmt(elapsedSec);$('active').textContent=fmt(activeSec)} function state(s){$('state').textContent=s}
function startClock(){clearInterval(timerId);timerId=setInterval(()=>{elapsedSec++;if(rec&&rec.state==='recording')activeSec++;paint()},1000)}
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];elapsedSec=0;activeSec=0;paint();rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=sendRec;rec.start();startClock();state('录音中');$('start').disabled=true;$('pause').disabled=false;$('resume').disabled=true;$('stop').disabled=false;$('r').innerHTML='<div class="ok">正在录音…</div>'}catch(e){$('r').innerHTML='<div class="bad">无法使用麦克风：'+esc(e.message)+'</div>'}};
$('pause').onclick=()=>{if(rec&&rec.state==='recording'){rec.pause();state('已暂停');$('pause').disabled=true;$('resume').disabled=false;$('r').innerHTML='<div class="warn">已暂停，可以继续思考。</div>'}};
$('resume').onclick=()=>{if(rec&&rec.state==='paused'){rec.resume();state('录音中');$('pause').disabled=false;$('resume').disabled=true;$('r').innerHTML='<div class="ok">已继续录音…</div>'}};
$('stop').onclick=()=>{if(!rec||rec.state==='inactive')return;const ok=confirm('确定结束本次录音吗？\n\n确认后会立即进行语音转写、AI分类、摘要并保存到 Google Drive。\n如果还要继续思考，请点“取消”。');if(!ok)return;clearInterval(timerId);if(rec.state==='paused'){try{rec.resume()}catch(e){}}rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());$('start').disabled=false;$('pause').disabled=true;$('resume').disabled=true;$('stop').disabled=true;state('处理中');$('r').textContent='正在转写、分类并归档…'};
async function sendRec(){let blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'});$('preview').src=URL.createObjectURL(blob);$('preview').style.display='block';let fd=new FormData();fd.append('file',blob,'voice_'+Date.now()+'.webm');let r=await fetch('/api/recording',{method:'POST',body:fd}),d=await r.json();if(r.ok){state('已完成');$('r').innerHTML='<div class="ok">已归档<br>分类：'+esc(d.category_path)+'<br>摘要：'+esc(d.summary)+'<br><a href="'+d.audio_link+'" target="_blank">原始语音</a> · <a href="'+d.text_link+'" target="_blank">转写文本</a></div><div class="transcript">'+esc(d.transcript)+'</div>'}else{state('处理失败');$('r').innerHTML='<div class="bad">'+esc(d.detail)+'</div>'}}
$('search').onclick=async()=>{let q=$('q').value.trim();if(!q)return;$('s').innerHTML='<p class="status">正在搜索…</p>';let d=await(await fetch('/api/search?q='+encodeURIComponent(q))).json();$('s').innerHTML=(d.results||[]).length?d.results.map(x=>'<div class="result"><div class="name">'+esc(x.name)+'</div><div class="path"><b>存放路径：</b>'+esc(x.full_path||'')+'</div><div class="meta">文件类型：'+esc(typeLabel(x.mime_type))+' · 上传时间：'+esc(fmtDate(x.created_at))+'</div><div class="summary">'+esc(x.summary||'')+'</div>'+(x.web_view_link?'<div class="meta"><a href="'+x.web_view_link+'" target="_blank">打开文件</a></div>':'')+'</div>').join(''):'<div class="bad">没有找到匹配资料</div>'};
</script></body></html>
